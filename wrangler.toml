name = "dnes"
compatibility_date = "2024-09-23"
main = "src/worker.js"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
DEV_MODE = "true"
IP_SALT = "dev-local-salt-change-in-prod"
# Keep in sync with seed/posts.json's length — /api/stats adds approved
# submissions on top of this baseline (revision-spec §1.3, §6.2).
SEED_COUNT = "58"

[[d1_databases]]
binding = "DB"
database_name = "dobaness"
database_id = "b1b52b2d-63aa-4242-8ce5-08369fab846b"

[[kv_namespaces]]
binding = "BLOCKLIST"
id = "f539916b6a814ea0964a126188e50886"
