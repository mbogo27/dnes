name = "dnes"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[vars]
DEV_MODE = "true"
IP_SALT = "dev-local-salt-change-in-prod"
# Keep in sync with seed/posts.json's length — /api/stats adds approved
# submissions on top of this baseline (revision-spec §1.3, §6.2).
SEED_COUNT = "37"

[[d1_databases]]
binding = "DB"
database_name = "dobaness"
database_id = "local-dev-db"

[[kv_namespaces]]
binding = "BLOCKLIST"
id = "local-dev-kv"
